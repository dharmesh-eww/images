name: Collect 4K wallpapers

on:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-wallpapers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover and download eligible wallpapers
        run: python scripts/collect_wallpapers.py
        env:
          MAX_NEW_PER_RUN: "10"
          PER_CATEGORY: "1"
          MIN_LONG_EDGE: "3840"
          MIN_SHORT_EDGE: "2160"
          MAX_FILE_BYTES: "15728640"
          MAX_REPO_IMAGE_BYTES: "314572800"

      - name: Commit new wallpapers and manifest
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wallpapers manifest.json
            git diff --cached --quiet || git commit -m "Add new open-license 4K wallpapers"
            git push
          else
            echo "No eligible new wallpapers found."
          fi
